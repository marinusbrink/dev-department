# Phase 3 caller (§11, after the first approved designs): copy to
# .github/workflows/dept-build.yml in the product repo. Start with PBIs in one
# low-risk domain (ryd: Master Data) — serialize per domain (§10).
name: department — build

on:
  issues:
    types: [labeled]
  # Convergence loop re-entry: the pipeline dispatches its own next round until
  # the reviewer approves or max-rounds is spent.
  workflow_dispatch:
    inputs:
      issue-number:
        description: PBI issue number (status:build)
        required: true
      round:
        description: Internal — convergence round counter; leave at 1 for manual runs
        default: "1"

permissions:
  contents: write
  issues: write
  pull-requests: write
  # For the convergence loop's self-dispatch.
  actions: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'status:build'
    uses: marinusbrink/dev-department/.github/workflows/build.yml@main
    with:
      issue-number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.issue-number) || github.event.issue.number }}
      round: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.round) || 1 }}
      # TODO(fill-from-repo) before enabling phase 3: the product CI workflow
      # name to dispatch when the PR goes gate-2-ready (agent pushes never
      # trigger CI by themselves; the CI workflow needs a workflow_dispatch
      # trigger). Example (opentms-next):
      # ci-workflow: "CI"
      # TODO(fill-from-repo) before enabling phase 3: the compile gate — a
      # command proving the tree compiles/lints/builds (NOT the test suite).
      # Example (opentms-next):
      # verify-command: "(cd backend && dotnet build App.slnx --nologo -v q) && (cd frontend && npm ci && npm run lint && npm run build)"
      # TODO(fill-from-repo) before enabling phase 3: the product toolchain the
      # implementer/test-engineer agents may run — copy the commands ryd's CI
      # actually uses. Without it agents can push but not build or test.
      # Example (opentms-next):
      # extra-allowed-tools: "Bash(dotnet:*),Bash(abp:*),Bash(npm:*),Bash(npx:*),Bash(psql:*),Bash(./scripts/generate-openapi.sh)"
      # TODO(fill-from-repo) before enabling phase 3: a repo script that
      # regenerates the OpenAPI spec + typed client (booting its own database if
      # needed) — runs mechanically between the backend and frontend agents so
      # the frontend never inherits a stale contract. Example (opentms-next):
      # contract-refresh-command: "./scripts/contract-refresh-ci.sh"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # DEPT_SYNC_TOKEN: ${{ secrets.DEPT_SYNC_TOKEN }}   # only while dev-department is private
