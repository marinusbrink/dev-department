# Reusable: design phase (§5). Three modes:
#   mode: architect      — caller triggers on issues labeled status:design; runs the architect agent, which opens the design PR (gate 1).
#   mode: design-fix     — caller triggers on submitted gate-1 review remarks on an open design PR; the architect revises the doc on the
#                          same branch (same PR, new commits — review history is learning data, §5). Approval stays the human merge.
#   mode: design-merged  — caller triggers on merged design PRs; flips the issue to status:build. Merging is the human approval act — agents never merge (§8).
name: dept-design

on:
  workflow_call:
    inputs:
      model:
        description: Model for every agent run in this workflow — explicit and workflow-owned; checked-in settings files never decide it
        required: false
        type: string
        default: claude-sonnet-4-6
      max-turns:
        description: >-
          Turn budget for the architect run (§8 — a stuck agent costs at most one
          run budget). Default is the highest in the pipeline: the architect
          produces the largest single artifact (the full nine-section design doc)
          in one run.
        required: false
        type: number
        default: 80
      mode:
        description: architect | design-fix | design-merged
        required: false
        type: string
        default: architect
      issue-number:
        description: PBI issue number (required for architect mode; parsed from the PR title in design-merged mode if 0)
        required: false
        type: number
        default: 0
      pr-number:
        description: Design PR number (design-merged mode)
        required: false
        type: number
        default: 0
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      DEPT_SYNC_TOKEN:
        required: false

concurrency:
  group: dept-design-${{ inputs.mode }}-${{ inputs.issue-number }}-${{ inputs.pr-number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Kill switch (AGENTS_ENABLED, §8)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.AGENTS_ENABLED }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AGENTS_ENABLED=false — kill switch active, exiting cleanly."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  architect:
    name: Architect agent
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && inputs.mode == 'architect'
    runs-on: ubuntu-latest
    steps:
      - name: Check out product repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync department (fresh from main, §3)
        uses: actions/checkout@v4
        with:
          repository: marinusbrink/dev-department
          ref: main
          path: .dev-department
          token: ${{ secrets.DEPT_SYNC_TOKEN || github.token }}

      - name: Prepare git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo ".dev-department/" >> .git/info/exclude

      - name: Run architect agent
        id: agent
        uses: ./.dev-department/.github/actions/run-agent
        with:
          model: ${{ inputs.model }}
          agent-file: agents/architect.md
          max-turns: ${{ inputs.max-turns }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          # The exact tool set the architect's definition requires (write the design
          # doc, branch/commit/push, open the design PR, report conflicts) — and no
          # more. Without an explicit allowlist, headless runs deny every mutating
          # tool call: incident 2026-08-13, 25 denials in 51 turns, no output.
          allowed-tools: "Read,Grep,Glob,Write,Edit,Bash(git status:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
          assignment: |
            Repository: ${{ github.repository }}
            PBI issue number: ${{ inputs.issue-number }}
            Work on a branch named design/${{ inputs.issue-number }}, commit the design doc there,
            push it, and open the design PR titled "Design: <feature> (#${{ inputs.issue-number }})"
            exactly as your definition specifies.

      - name: Summary
        run: echo "Architect result '${{ steps.agent.outputs.result }}'." >> "$GITHUB_STEP_SUMMARY"

  design-fix:
    name: Architect agent — address gate-1 remarks
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && inputs.mode == 'design-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out product repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync department (fresh from main, §3)
        uses: actions/checkout@v4
        with:
          repository: marinusbrink/dev-department
          ref: main
          path: .dev-department
          token: ${{ secrets.DEPT_SYNC_TOKEN || github.token }}

      - name: Check out the design PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo ".dev-department/" >> .git/info/exclude
          gh pr checkout "${{ inputs.pr-number }}" --repo "${{ github.repository }}"

      # Inline file/line review comments are structurally invisible to the agent:
      # its allowlist exposes `gh pr view` (review bodies + top-level comments
      # only), and the threads API needs `gh api`, which agents don't get.
      # Incident 2026-08-17, design PR opentms-next#11: a remark left twice as an
      # inline comment was never read by any revision run. Collect everything
      # mechanically into the synced (git-excluded) .dev-department/ dir instead.
      - name: Collect review threads (inline comments are invisible to gh pr view)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ inputs.pr-number }}"
          OUT=".dev-department/review-threads.md"
          echo "# Review remarks on PR #${PR} — mechanically collected; inline comments included" > "$OUT"
          gh api "repos/${{ github.repository }}/pulls/${PR}/comments" --paginate \
            --jq '.[] | "\n### Inline — \(.user.login) @ \(.path) line \(.line // .original_line)\n\(.body)\n"' >> "$OUT"
          gh api "repos/${{ github.repository }}/pulls/${PR}/reviews" --paginate \
            --jq '.[] | select(.body != null and .body != "") | "\n### Review (\(.state)) — \(.user.login)\n\(.body)\n"' >> "$OUT"
          echo "Collected review remarks:" && cat "$OUT"

      - name: Run architect agent (revision)
        id: agent
        uses: ./.dev-department/.github/actions/run-agent
        with:
          model: ${{ inputs.model }}
          agent-file: agents/architect.md
          max-turns: ${{ inputs.max-turns }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          # Revision runs revise the doc on the existing branch and reply to
          # remarks — no branch creation, no PR creation (incident 2026-08-14,
          # run 31795608586: gate-1 remarks reached no agent at all — the fix
          # loop deliberately serves Feature: PRs only).
          allowed-tools: "Read,Grep,Glob,Write,Edit,Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          assignment: |
            Repository: ${{ github.repository }}
            Design PR #${{ inputs.pr-number }} (branch already checked out) received
            gate-1 review remarks. This is a revision run per your "Revision runs"
            section. ALL remarks — review bodies AND inline file/line comments —
            are pre-collected at .dev-department/review-threads.md; read that
            file FIRST and treat it as the complete remark list (`gh pr view`
            does not show inline threads). Revise the design doc on this branch,
            reply where a remark rests on a misunderstanding, and push. End with
            RESULT: design-pr:${{ inputs.pr-number }} or RESULT: blocked.

      - name: Summary
        run: echo "Architect revision result '${{ steps.agent.outputs.result }}'." >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Gate 1 passed → status:build
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && inputs.mode == 'design-merged'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ inputs.issue-number }}"
          if [ "$ISSUE" = "0" ]; then
            TITLE=$(gh pr view "${{ inputs.pr-number }}" --repo "${{ github.repository }}" --json title -q .title)
            ISSUE=$(printf '%s' "$TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          fi
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "0" ]; then
            echo "::error::Cannot determine the PBI issue number from design PR #${{ inputs.pr-number }} — expected '(#<issue>)' in the PR title."
            exit 1
          fi
          gh issue edit "$ISSUE" --repo "${{ github.repository }}" --add-label "status:build"
          gh issue edit "$ISSUE" --repo "${{ github.repository }}" --remove-label "status:design" || true
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body \
            "✅ Design approved at gate 1 (design PR #${{ inputs.pr-number }} merged) → \`status:build\`."

  report-failure:
    name: Failure is visible (§1, §8)
    needs: [gate, architect, design-fix, promote]
    if: always() && needs.gate.outputs.enabled == 'true' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="⚠️ **Agent workflow \`design\` (mode: ${{ inputs.mode }}) failed** — [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Silent failure is forbidden (design §8); this comment is the alarm."
          if [ "${{ inputs.issue-number }}" != "0" ]; then
            gh issue comment "${{ inputs.issue-number }}" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh pr comment "${{ inputs.pr-number }}" --repo "${{ github.repository }}" --body "$BODY"
          fi
