name: run-agent
description: >
  Run one department agent via anthropics/claude-code-action and parse its
  mandatory final "RESULT:" line. Fails the step if the agent ends without
  one (contract violation — workflows must be able to branch).

inputs:
  agent-file:
    description: Agent definition path inside the synced .dev-department checkout, e.g. agents/intake.md
    required: true
  assignment:
    description: Task-specific assignment appended to the agent prompt (issue/PR numbers, branch, design doc path)
    required: true
  anthropic-api-key:
    description: API key from the caller's ANTHROPIC_API_KEY secret
    required: true
  github-token:
    description: Token used by the agent's gh calls and by the action
    required: true
  max-turns:
    description: Conservative per-run turn cap (§8 — a stuck agent costs at most one run budget)
    required: true
  model:
    description: >-
      Model ID for this agent run. Required and workflow-owned on purpose: with
      --model always passed, neither checked-in .claude settings files nor the
      CLI's dynamic default-model resolution can ever decide the department's
      model (incident 2026-08-13: runs failed on a server-resolved
      "claude-opus-5[1m]" interactive alias the SDK rejects).
    required: true
  allowed-tools:
    description: Optional --allowedTools value; use to technically restrict read/comment-only agents
    required: false
    default: ""

outputs:
  result:
    description: >-
      RESULT payload without the "RESULT: " prefix
      (e.g. ready, questions:3, done, blocked, approved, blockers:2)
    value: ${{ steps.parse.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run agent
      id: claude
      # The execution file, not the action's exit code, decides this composite's
      # outcome — see the "Evaluate outcome" step (incident 2026-08-14, run
      # 31797494981: the action failed a SUCCESSFUL run post-hoc because the
      # runtime never enforced maxTurns during execution and the action then
      # punished the completed result for exceeding it).
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        # The convergence loop's self-dispatched rounds run as the github-actions
        # bot; without this the action refuses every agent step of a dispatched
        # round ("Workflow initiated by non-human actor", 2026-08-18, runs
        # 32133033383/32133085778 — two rounds burned in 90 seconds).
        allowed_bots: "github-actions"
        prompt: |
          You are one agent of the software development department. Your complete
          system prompt is the file `.dev-department/${{ inputs.agent-file }}` in this
          workspace: read it FIRST and follow it exactly, including its mandatory
          final RESULT line. Files it references as conventions/, templates/ or
          lessons/ are synced at .dev-department/ — read them from there. Never
          commit the .dev-department/ directory itself.

          Assignment:
          ${{ inputs.assignment }}
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          ${{ inputs.allowed-tools != '' && format('--allowedTools "{0}"', inputs.allowed-tools) || '' }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    # The action hides the transcript by default and the execution file dies with
    # the runner — twice now a denial list was unrecoverable when an incident
    # needed it (runs 31714423931, 31750544961). Artifacts are repo-collaborator
    # only; 30 days covers any incident review.
    - name: Unique artifact name
      if: always()
      id: uniq
      shell: bash
      run: echo "name=agent-execution-$(basename "${{ inputs.agent-file }}" .md)-$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Preserve execution output (§8 — denials stay diagnosable)
      if: always() && steps.claude.outputs.execution_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.uniq.outputs.name }}
        path: ${{ steps.claude.outputs.execution_file }}
        retention-days: 30
        if-no-files-found: ignore

    - name: Evaluate outcome (the execution file is the contract, §8)
      shell: bash
      run: |
        FILE="${{ steps.claude.outputs.execution_file }}"
        if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
          echo "::error::No execution output produced — the agent never ran (action-level failure)."
          exit 1
        fi
        SUBTYPE=$(python3 -c "import json; print(next((m.get('subtype','') for m in json.load(open('$FILE')) if m.get('type')=='result'), ''))")
        TURNS=$(python3 -c "import json; print(next((m.get('num_turns','?') for m in json.load(open('$FILE')) if m.get('type')=='result'), '?'))")
        if [ "$SUBTYPE" != "success" ]; then
          echo "::error::Agent run ended '${SUBTYPE:-unknown}' after $TURNS turns — failed."
          exit 1
        fi
        if [ "${{ steps.claude.outcome }}" = "failure" ]; then
          # A finished run with a success result is budget already spent; failing
          # it doubles the spend. Pass, but surface the overshoot loudly — the
          # turn cap (§8) stays a real budget signal for the PO.
          echo "::warning::Agent succeeded in $TURNS turns, over the ${{ inputs.max-turns }} cap — action exit overridden; review the role's budget (§8)."
          echo "⚠️ Turn budget overshoot: $TURNS turns (cap ${{ inputs.max-turns }}) — run succeeded, action exit overridden." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Parse RESULT line
      id: parse
      shell: bash
      run: |
        FILE="${{ steps.claude.outputs.execution_file }}"
        # The RESULT line must come from the agent's own FINAL message — never
        # from definition files or other text quoted earlier in the transcript.
        # Incident 2026-08-18 (run 32132616101): a raw grep over the whole
        # execution file matched "RESULT: blocked" quoted from the agent's own
        # definition, and an 8-turn do-nothing run masqueraded as a legitimate
        # block.
        LINE=$(python3 - "$FILE" <<'PY'
        import json, re, sys
        data = json.load(open(sys.argv[1]))
        texts = [b['text'] for m in data if m.get('type') == 'assistant'
                 for b in m.get('message', {}).get('content', []) if b.get('type') == 'text']
        if texts:
            found = re.findall(r'RESULT: [a-z-]+(?::[0-9]+)?', texts[-1])
            if found:
                print(found[-1])
        PY
        )
        if [ -z "$LINE" ]; then
          echo "::error::Agent's final message carries no RESULT line — treating the run as failed (contract violation)."
          exit 1
        fi
        echo "result=${LINE#RESULT: }" >> "$GITHUB_OUTPUT"
        echo "Agent reported: $LINE"
